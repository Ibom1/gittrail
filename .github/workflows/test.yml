name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest -v
      - name: Run the demo
        run: python -m gittrail demo
      - name: Add demo output to the job summary
        if: matrix.python == '3.13'
        shell: bash
        run: |
          set -e
          {
            echo '### gittrail demo'
            echo '```'
            python -m gittrail demo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
