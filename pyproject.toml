[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gittrail"
version = "0.2.0"
description = "Read a repository's git history and explain how the code got where it is."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Otoobong John" }]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
gittrail = "gittrail.cli:main"

[tool.setuptools]
packages = ["gittrail"]
